name: token-risk-check

on:
  push:
    paths:
      - "plugins/token-risk-check/**"
      - "wit/v0/**"
      - ".github/workflows/token-risk-check.yml"
  pull_request:
    paths:
      - "plugins/token-risk-check/**"
      - "wit/v0/**"
      - ".github/workflows/token-risk-check.yml"

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/token-risk-check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --check
      - name: Host tests
        run: cargo test
      - name: Host lint
        run: cargo clippy --all-targets -- -D warnings
      - name: WASI component build
        run: cargo build --release --target wasm32-wasip2
      - name: Commit generated lockfile
        if: github.event_name == 'push'
        working-directory: ${{ github.workspace }}
        run: |
          if [[ -n "$(git status --porcelain -- plugins/token-risk-check/Cargo.lock)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add plugins/token-risk-check/Cargo.lock
            git commit -m "chore(token-risk-check): lock dependencies"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
