[package]
name = "caixa-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "wasm32-wasip2-friendly Solana substrate for Caixa ZeroClaw plugins: JSON-RPC, Solana Pay, SPL transfer builders, durable nonce."
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "zeroize"] }

[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
