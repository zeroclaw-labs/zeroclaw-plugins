[package]
name = "zc-drive-build"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Demo driver: runs the spl-transfer-build component core on the host against a local fake or a read-only RPC endpoint."
publish = false

[dependencies]
serde_json = "1"
spl-transfer-build = { path = "../../../plugins/spl-transfer-build" }
# Same package the plugin depends on (its vendored copy), so the lockfile has
# exactly one solana-core-wasi. Used only to decode the base64 the component
# returned and report its real byte length.
solana-core-wasi = { path = "../../../plugins/spl-transfer-build/solana-core" }

# Standalone: one plugin crate per driver. Each plugin carries its own vendored
# copy of solana-core (CI snapshots only plugins/<name> + wit/v0), and cargo
# refuses two same-version packages from different paths in one lockfile, so
# the drivers cannot share a workspace.
[workspace]
