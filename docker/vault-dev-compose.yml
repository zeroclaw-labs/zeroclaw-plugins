# ZeroClaw Solana plugins — Vault dev-mode compose
#
# Brings up a single-node HashiCorp Vault server in development mode.
# Dev mode stores data in memory (no persistence) and uses a fixed root
# token — fine for the bounty Quickstart, NOT for production.
#
# Usage:
#   docker compose -f docker/vault-dev-compose.yml up -d
#   bash docker/vault-init.sh
#
# The init script enables the transit engine, creates the ed25519 session
# key, and prints the base58 pubkey the Solana plugins use as signer_pubkey.

services:
  vault:
    image: hashicorp/vault:latest
    container_name: zeroclaw-vault-dev
    ports:
      - "8200:8200"
    environment:
      # Dev server: listens on all interfaces, fixed root token for the demo.
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS_GUARD: "false"
    cap_add:
      - IPC_LOCK
    healthcheck:
      # Vault reports sealed=false once the dev server is ready.
      test:
        - "CMD-SHELL"
        - "curl -sf http://localhost:8200/v1/sys/health -o /dev/null -w '%{http_code}' | grep -q '200\\|429\\|472\\|503' || exit 1"
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    restart: "no"
