[package]
name = "autopay-delegate"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Solana Agentic Autopay Suite: Build unsigned SPL Token Approve transactions (T1)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
solana-plugin-core = { path = "../solana-plugin-core" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
