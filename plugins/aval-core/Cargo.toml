# Shared pure-Rust Solana substrate for the Aval tool-plugin suite
# (nonce-vault-init, durable-tx-build, approval-recheck). No solana-sdk, no
# solana-client: everything a wasm32-wasip2 WIT component needs is hand-rolled
# here — base58/base64, compact-u16, legacy message construction, system/SPL
# instruction encoding, durable-nonce account parsing, and a JSON-RPC client
# behind an injectable HTTP trait so hosts test with mocks and the wasm shim
# plugs in waki.
[package]
name = "aval-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SDK-less Solana primitives for ZeroClaw WASM tool plugins: durable-nonce transactions, SPL transfers, PDA/ATA derivation, JSON-RPC shaping."
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# sha2 + curve25519-dalek: the minimum needed for PDA/ATA derivation
# (find_program_address requires an ed25519 off-curve check). Both are pure
# Rust and compile cleanly for wasm32-wasip2.
sha2 = { version = "0.10", default-features = false }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc"] }

# Standalone crate: consumed by sibling plugin crates via path dependency.
[workspace]
