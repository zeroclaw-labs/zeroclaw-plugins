name = "blockhash-validity"
version = "0.1.0"
description = "Check whether a public recent blockhash is still valid for transaction processing."
author = "Mateo Rojas"
wasm_path = "blockhash_validity.wasm"
capabilities = ["tool"]
# http_client: one read-only isBlockhashValid request.
# config_read: reads only rpc_url and commitment.
permissions = ["http_client", "config_read"]
