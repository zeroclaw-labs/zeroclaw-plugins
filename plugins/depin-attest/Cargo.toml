# Standalone crate (own [workspace]): built for wasm32-wasip2 as a tool
# plugin component; the pure `depin_attest` core (rlib) is host-tested with
# plain `cargo test`. No `waki`/wasi:http dependency at all -- this plugin
# never makes an outbound call, so there is nothing to gate to wasm-only.
[package]
name = "depin-attest"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "ZeroClaw WIT tool plugin: edge-node attestation via durable-nonce transactions against the SPL Memo program."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = "1.5"
base64 = "0.22"
zeroclaw-solana-core = { path = "vendor/zeroclaw-solana-core" }

[dev-dependencies]
bs58 = "0.5"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Standalone crate: built for wasm32-wasip2, not part of the host workspace.
[workspace]
