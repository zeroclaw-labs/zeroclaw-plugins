[package]
name = "depin-attest"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw T1 tool plugin: sensor reading -> unsigned Solana Memo attestation tx. Never holds a key."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
sha2 = "0.10"
thiserror = "1"
base64 = "0.22"

# wasm-only: the host build (and `cargo test`) never compiles these.
[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = "0.46"
waki = { version = "0.5.1", features = ["json"] }

[dev-dependencies]
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Standalone crate: built for wasm32-wasip2, not part of the repo workspace.
[workspace]
