# Standalone crate (own [workspace]): built for wasm32-wasip2 as a tool
# plugin component; the pure core (att/tx/rpc, rlib) is host-tested with
# plain `cargo test`. `waki` (the blocking wasi:http client) is a wasm-only
# dep so the host test build never tries to compile it.
[package]
name = "depin-attest"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "ZeroClaw WIT tool plugin: turn a sensor reading from a DePIN device (Raspberry Pi & friends) into an unsigned, hash-chained Solana memo attestation a human approves and signs. T1 — no keys held."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
base64 = "0.22"
sha2 = "0.10"

# wasi:http client — only compiled for the wasm component, never on the host.
[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Standalone crate: built for wasm32-wasip2, not part of the host workspace.
[workspace]
