# Standalone crate (own [workspace]): built for wasm32-wasip2 as a WIT tool-plugin
# component; the pure `depin_attest` core (rlib) is host-tested with plain
# `cargo test`. `waki` (the blocking wasi:http client) is pulled transitively
# through `palinurus-core` (which exports `WakiRpc`); the shim constructs a
# `WakiRpc` and passes it as `&dyn Rpc` — no direct waki dep needed here.
[package]
name = "depin-attest"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Palinurus DePIN sensor attestation tool: SAS create_attestation + durable nonce, T1 default + T2 opt-in."
publish = false

# cdylib for the wasm component; rlib so the pure attestation core is testable
# on the host with a plain `cargo test`.
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "depin-attest-demo"
path = "src/bin/depin-attest-demo.rs"
required-features = ["demo"]

[dependencies]
# The wasm32-wasip2-friendly Solana substrate (PDA, borsh, versioned-tx,
# durable-nonce, RPC over waki, response shaping). Git dep during dev;
# flipped to `palinurus-core = "0.1"` (crates.io) at end of Phase 2.
palinurus-core = "0.1"
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1", features = ["derive"] }
sha2 = "0.10"
base64 = "0.22"
# T2 signing — pure Rust, wasm32-wasip2-friendly. Ed25519 sign is deterministic
# (RFC 8032); the session key is pre-generated by the operator and loaded from
# config, never generated on-device. No `rand_core` feature needed.
ed25519-dalek = "2"
bs58 = "0.5"  # base58 decode for the T2 session key (32-byte Ed25519 secret)
# Host-only demo driver (`--features demo`): a reqwest-backed Rpc impl that
# runs execute_t1 against a real devnet durable-nonce account on camera. NOT
# part of the wasm component — excluded by the `optional` gate + the feature.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }

[dev-dependencies]
# Host-only oracle: verify the T2 signature against the canonical Solana/Ed25519
# verifier. NOT compiled into the wasm component (dev-dep, host tests only).
solana-program = "2"
# Used only by the `--features demo` integration tests (tests/demo_rpc.rs).
# Compiles for normal `cargo test` too (unused) — small, doesn't touch wasm.
mockito = "1"

[features]
# Host-only demo driver (`--features demo`): reqwest-backed Rpc impl + bin
# that runs execute_t1 against a real devnet durable-nonce account on camera
# (chunk 6 of the recording guide). Off by default — wasm build + 68 core
# tests are unaffected.
default = []
demo = ["dep:reqwest"]

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
# Panic on overflow in release: the plugin does lamport / HNT-bone arithmetic;
# silent overflow in amount math is a real footgun. Defense in depth.
overflow-checks = true

# Standalone crate: built for wasm32-wasip2, not part of the host workspace.
[workspace]