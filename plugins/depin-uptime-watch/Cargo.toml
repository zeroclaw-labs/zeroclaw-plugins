[package]
name = "depin-uptime-watch"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw WIT plugin: watch DePIN Solana memo freshness with shaped verdicts."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
base64 = "0.22"
thiserror = "2"

[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
overflow-checks = true

[workspace]
