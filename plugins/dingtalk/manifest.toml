name = "dingtalk"
version = "0.2.0"
description = "DingTalk Stream Mode channel plugin for ZeroClaw: gateway WebSocket + session-webhook replies."
author = "JordanTheJet"
wasm_path = "dingtalk.wasm"
capabilities = ["channel"]
sender_match = "exact"
registry = false
permissions = ["http_client", "websocket_client", "config_read"]
provides = "dingtalk"

[egress]
hosts = ["api.dingtalk.com"]

[config_schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
additionalProperties = false
required = ["client_id", "client_secret"]

[config_schema.properties.client_id]
type = "string"
minLength = 1

[config_schema.properties.client_secret]
type = "string"
minLength = 1
x-secret = true

[config_schema.properties.enabled]
type = "boolean"
