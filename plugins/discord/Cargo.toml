# Standalone crate (own [workspace]): built for wasm32-wasip2 as a channel
# plugin component; the pure `discord` core (rlib), including the gateway state
# machine and the reply rules, is host-tested with plain `cargo test`. `wasip2`
# provides the wasi:http bindings, used directly so every request carries
# connect, first-byte, and between-bytes timeouts; it is a wasm-only dep so the
# host test build never compiles it. The host `websocket` import exists only in
# the wasm component, so `lib.rs` performs the I/O the core decides on.
[package]
name = "discord"
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Discord channel plugin for ZeroClaw: the Gateway over the host websocket resource, replies over REST through wasi:http."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# wasi:http bindings: only compiled for the wasm component, never on the host.
[target.'cfg(target_family = "wasm")'.dependencies]
wasip2 = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Standalone crate: built for wasm32-wasip2, not part of the host workspace.
[workspace]
