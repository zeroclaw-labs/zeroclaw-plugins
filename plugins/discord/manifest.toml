name = "discord"
version = "0.1.1"
description = "Discord channel plugin for ZeroClaw: the Gateway over the host websocket resource, replies over REST through wasi:http."
author = "JordanTheJet"
wasm_path = "discord.wasm"
capabilities = ["channel"]
# Needs ZeroClaw v0.8.6 or later: it binds the host contract (the websocket
# resource, typed config, point-of-use secrets) first released in v0.8.6.
registry = true
# websocket_client: the Discord Gateway, a persistent WebSocket the host dials
#   and pumps; the plugin speaks the Gateway protocol over it.
# http_client: gateway discovery (GET /gateway/bot), replies
#   (POST /channels/{id}/messages), and the health check (GET /users/@me).
# config_read: the typed config below through config.get; bot_token is
#   x-secret and reaches the plugin only through secrets.get.
permissions = ["websocket_client", "http_client", "config_read"]
# provides: the built-in channel this package can stand in for. Hosts construct
# this plugin only from an explicit [channels.plugin.<alias>] binding, so it
# never reads [channels.discord.*].
provides = "discord"

# The hosts this plugin contacts. A declaration grants nothing: an operator
# grants them with `zeroclaw plugin bind discord --channel-alias <alias>
# --egress declared`. discord.com serves the REST API and gateway discovery;
# Discord hands out the gateway and its resume hosts under discord.gg. A
# suffix pattern does not match its apex, which this plugin never contacts.
[egress]
hosts = ["discord.com", "*.discord.gg"]

[config_schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
additionalProperties = false
required = ["bot_token"]

# The bot token from the Discord Developer Portal. Sent as
# `Authorization: Bot <token>` to api_base and in the gateway handshake.
[config_schema.properties.bot_token]
type = "string"
minLength = 1
x-secret = true

# Discord ids are decimal strings: they exceed what a JSON number holds exactly.
[config_schema.properties.guild_ids]
type = "array"
items = { type = "string", pattern = '^[0-9]{1,20}$' }

# Also the send target when a reply carries no recipient.
[config_schema.properties.channel_ids]
type = "array"
items = { type = "string", pattern = '^[0-9]{1,20}$' }

[config_schema.properties.listen_to_bots]
type = "boolean"

[config_schema.properties.mention_only]
type = "boolean"

# Unset means 37376: guild and direct messages with their content.
[config_schema.properties.intents_mask]
type = "integer"
minimum = 0

# Receives the bot token. Point it only at a host you trust, and grant that
# host in egress_hosts.
[config_schema.properties.api_base]
type = "string"
pattern = '^https?://\S+$'

# Dial this gateway instead of discovering one. A session's resume URL still
# wins on a resume.
[config_schema.properties.gateway_url]
type = "string"
pattern = '^wss?://\S+$'
