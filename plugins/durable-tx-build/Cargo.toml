# Aval flagship: builds unsigned SOL/SPL transfers anchored to a durable nonce
# so they survive an approval queue indefinitely. Pure logic in `build.rs`
# (host-tested), wasm shim in `lib.rs`.
[package]
name = "durable-tx-build"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw WIT plugin: build unsigned Solana transfers on durable nonces — approval-queue-safe, allowlisted, capped, zero secrets."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aval-core = { path = "../aval-core" }
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Standalone crate: built for wasm32-wasip2, not part of the host workspace.
[workspace]
