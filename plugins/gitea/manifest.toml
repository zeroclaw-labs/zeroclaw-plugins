name = "gitea"
version = "0.3.0"
description = "Gitea/Forgejo channel plugin for ZeroClaw: notifications long-poll + issue/PR comment replies over wasi:http."
author = "JordanTheJet"
wasm_path = "gitea.wasm"
capabilities = ["channel"]
# Needs ZeroClaw v0.8.6 or later: it binds the plugin contract first released
# in v0.8.6 (typed config through config.get, credentials through
# secrets.get), and reads both when the host configures the instance.
registry = true
sender_match = "case_insensitive"
# http_client: notification polling and issue/PR comments on the forge's REST
#   API (TLS is performed host-side).
# config_read: the typed config below through config.get; access_token is
#   x-secret and reaches the plugin only through secrets.get.
permissions = ["http_client", "config_read"]
# provides: the built-in channel this package can stand in for. Hosts construct
# this plugin only from an explicit [channels.plugin.<alias>] binding, so it
# never reads [channels.git.*].
provides = "git"

# No [egress] table: the server is the operator's own, so its host cannot be
# declared here. Grant it in the instance's egress_hosts after binding.

[config_schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
required = ["provider", "api_base_url", "access_token"]
additionalProperties = false

[config_schema.properties.provider]
type = "string"
minLength = 1
[config_schema.properties.api_base_url]
type = "string"
minLength = 1
[config_schema.properties.access_token]
type = "string"
x-secret = true
minLength = 1
[config_schema.properties.mention_only]
type = "boolean"
[config_schema.properties.listen_to_bots]
type = "boolean"
