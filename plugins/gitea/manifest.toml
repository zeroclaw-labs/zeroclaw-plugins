name = "gitea"
version = "0.2.0"
description = "Gitea/Forgejo channel plugin for ZeroClaw: notifications long-poll + issue/PR comment replies over wasi:http."
author = "JordanTheJet"
wasm_path = "gitea.wasm"
capabilities = ["channel"]
sender_match = "case_insensitive"
# http_client: outbound REST calls to the configured Gitea/Forgejo instance
# (TLS is performed host-side).
# config_read: read the api_base_url + access_token from this channel's config.
permissions = ["http_client", "config_read"]
# provides: mirror the built-in `git` channel — read [channels.git.*] and honor
# native-wins. The native `git` channel type serves GitHub, Gitea, and Forgejo;
# this plugin implements only the Gitea/Forgejo REST provider and stays inert
# unless `provider` is `gitea`/`forgejo`. Inert on hosts without the `provides`
# feature (they load this as a novel channel named `gitea`, configured from
# [[plugins.entries.gitea]]).
provides = "git"

# ── typed plugin config ───────────────────────────────────────────────────────
# `config_read` and `config_schema` are a biconditional: a host carrying the
# typed-config enforcement refuses to discover a manifest that requests one
# without the other (crates/zeroclaw-plugins/src/config.rs,
# compile_manifest_config). See zeroclaw-labs/zeroclaw-plugins#147.
#
# Keys are exactly the set this package's guest config struct
# deserializes from the JSON the host hands to `configure`, so
# `additionalProperties = false` cannot reject a key the plugin reads.
#
# `required` is the minimum set the guest's own activation predicate needs
# before it will make a call; a withheld `config_read` grant then fails closed
# instead of starting the channel half-configured.
#
# No `x-secret` here on purpose: the channel ABI vendored in this repo is
# `configure(config: string)` and the host serializes the whole operator map
# into that string, so the guest still receives credentials inline. Marking
# them `x-secret` only becomes correct alongside a guest that reads them
# through `secrets.get()` on the point-of-use ABI — a separate change.
[config_schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
required = ["provider", "api_base_url", "access_token"]
additionalProperties = false

[config_schema.properties.provider]
type = "string"
minLength = 1
[config_schema.properties.api_base_url]
type = "string"
minLength = 1
[config_schema.properties.access_token]
type = "string"
minLength = 1
[config_schema.properties.mention_only]
type = "boolean"
[config_schema.properties.listen_to_bots]
type = "boolean"
