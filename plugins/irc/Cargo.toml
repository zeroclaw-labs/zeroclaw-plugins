# Standalone crate (own [workspace]): built for wasm32-wasip2 as a channel
# plugin component; the pure `irc` core (rlib) holds the protocol state machine
# and is host-tested with plain `cargo test`. The host `sockets` import exists
# only in the wasm component, so `lib.rs` performs the I/O the core decides on.
[package]
name = "irc"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "IRC channel plugin for ZeroClaw: TLS, IRCv3 SASL (PLAIN or EXTERNAL), NickServ, paced text chat."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Standalone crate: built for wasm32-wasip2, not part of the host workspace.
[workspace]
