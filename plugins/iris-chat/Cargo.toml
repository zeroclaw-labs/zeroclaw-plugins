[package]
name = "iris-chat"
version = "0.2.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
description = "Iris Chat channel: Signal-like Nostr Double Ratchet messaging without phone numbers or signup."
homepage = "https://irischat.org"
repository = "https://github.com/irislib/iris-chat-channels"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"

[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = "=0.46.0"
waki = { version = "=0.5.1", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[workspace]
