[package]
name = "jupiter-swap-build-safe"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "ZeroClaw tool plugin for guarded unsigned Jupiter swap construction."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solsafe-core = { path = "../solsafe-core" }

[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1", features = ["json"] }

[dev-dependencies]
base64 = "0.22"
bs58 = "0.5"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
