[package]
name = "jupiter-swap-execute"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "ZeroClaw WIT plugin: quote and execute Solana swaps via Jupiter with OutLayer custody enforcement"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bs58 = "0.5"
ureq = { version = "2", optional = true }

# wasi:http client — only compiled for the wasm component, never on the host.
# `waki` is a blocking HTTP client on top of wasi:http/outgoing-handler.
[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1", features = ["json"] }

[features]
e2e = ["ureq"]

[[bin]]
name = "e2e-swap"
path = "src/bin/e2e_swap.rs"
required-features = ["e2e"]

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
