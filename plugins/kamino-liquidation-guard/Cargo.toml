[package]
name = "kamino-liquidation-guard"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw T0 tool plugin for fail-closed Kamino lending health monitoring."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
bs58 = "0.5"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
wit-bindgen = "0.46"

[target.'cfg(target_family = "wasm")'.dependencies]
waki = "0.5.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
