name = "lark"
version = "0.2.0"
description = "Lark / Feishu channel plugin for ZeroClaw: webhook ingress + im/v1/messages send over wasi:http."
author = "JordanTheJet"
wasm_path = "lark.wasm"
capabilities = ["channel"]
registry = false
permissions = ["http_client", "config_read"]
provides = "lark"

[egress]
hosts = ["open.larksuite.com", "open.feishu.cn"]

[config_schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
additionalProperties = false

[config_schema.properties.enabled]
type = "boolean"

[config_schema.properties.app_id]
type = "string"

[config_schema.properties.api_base_url]
type = "string"

[config_schema.properties.use_feishu]
type = "boolean"

[config_schema.properties.per_user_session]
type = "boolean"

[config_schema.properties.app_secret]
type = "string"
x-secret = true
minLength = 1

[config_schema.properties.verification_token]
type = "string"
x-secret = true
minLength = 1

[config_schema.properties.encrypt_key]
type = "string"
x-secret = true
minLength = 1
