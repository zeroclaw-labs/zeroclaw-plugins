[package]
name = "lending-health"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Read-only Solana lending position health for Kamino (v0.1)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
