[package]
name = "lending-health"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw WIT tool plugin: read-only Solana lending position health (Kamino v0), built for cron SOP liquidation alerts"
publish = false

# cdylib for the wasm component; rlib so the pure health core is testable
# on the host with a plain `cargo test`. (Same split as plugins/redact-text.)
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"

# wasi:http client — only compiled for the wasm component, never on the host.
[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Standalone crate: built for wasm32-wasip2, not part of the host workspace.
[workspace]
