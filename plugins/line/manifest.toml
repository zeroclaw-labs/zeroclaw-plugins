name = "line"
version = "0.2.0"
description = "LINE channel plugin for ZeroClaw: webhook ingress (host-verified) + Messaging API push over wasi:http."
author = "JordanTheJet"
wasm_path = "line.wasm"
capabilities = ["channel"]
registry = false
permissions = ["http_client", "config_read"]
provides = "line"

[egress]
hosts = ["api.line.me"]

[config_schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
additionalProperties = false

[config_schema.properties.api_base]
type = "string"

[config_schema.properties.api_base_url]
type = "string"

[config_schema.properties.channel_access_token]
type = "string"
x-secret = true
minLength = 1

[config_schema.properties.channel_secret]
type = "string"
x-secret = true
minLength = 1
