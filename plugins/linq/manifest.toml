name = "linq"
version = "0.2.0"
description = "Linq (Partner V3 API: iMessage/RCS/SMS) channel plugin for ZeroClaw: signed webhook ingress + text send over wasi:http."
author = "JordanTheJet"
wasm_path = "linq.wasm"
capabilities = ["channel"]
registry = false
permissions = ["http_client", "config_read"]
provides = "linq"

[egress]
hosts = ["api.linqapp.com"]

[config_schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
additionalProperties = false

[config_schema.properties.enabled]
type = "boolean"

[config_schema.properties.from_phone]
type = "string"

[config_schema.properties.api_token]
type = "string"
x-secret = true
minLength = 1

[config_schema.properties.signing_secret]
type = "string"
x-secret = true
minLength = 1
