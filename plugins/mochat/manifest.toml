name = "mochat"
version = "0.4.0"
description = "Mochat customer-service channel plugin for ZeroClaw: message-receive polling + message-send over wasi:http."
author = "JordanTheJet"
wasm_path = "mochat.wasm"
capabilities = ["channel"]
# Needs ZeroClaw v0.8.6 or later: it binds the plugin contract first released
# in v0.8.6 (typed config through config.get, credentials through
# secrets.get), and reads both when the host configures the instance.
registry = true
# http_client: message-receive polling and message-send on your Mochat server
#   (TLS is performed host-side).
# config_read: the typed config below through config.get; api_token is
#   x-secret and reaches the plugin only through secrets.get.
permissions = ["http_client", "config_read"]
# provides: the built-in channel this package can stand in for. Hosts construct
# this plugin only from an explicit [channels.plugin.<alias>] binding, so it
# never reads [channels.mochat.*].
provides = "mochat"

# No [egress] table: the server is the operator's own, so its host cannot be
# declared here. Grant it in the instance's egress_hosts after binding.

[config_schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
required = ["api_url", "api_token"]
additionalProperties = false

[config_schema.properties.enabled]
type = "boolean"
[config_schema.properties.api_url]
type = "string"
minLength = 1
[config_schema.properties.api_token]
type = "string"
x-secret = true
minLength = 1
[config_schema.properties.poll_interval_secs]
type = "integer"
[config_schema.properties.excluded_tools]
type = "array"
[config_schema.properties.excluded_tools.items]
type = "string"
