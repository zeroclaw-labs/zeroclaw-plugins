name = "nextcloud"
version = "0.2.0"
description = "Nextcloud Talk channel plugin for ZeroClaw: bot-webhook ingest (HMAC-SHA256 verified) + OCS chat send over wasi:http."
author = "JordanTheJet"
wasm_path = "nextcloud.wasm"
capabilities = ["channel"]
registry = false
permissions = ["http_client", "config_read"]
provides = "nextcloud_talk"

[config_schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
additionalProperties = false

[config_schema.properties.base_url]
type = "string"

[config_schema.properties.bot_name]
type = "string"

[config_schema.properties.app_token]
type = "string"
x-secret = true
minLength = 1

[config_schema.properties.webhook_secret]
type = "string"
x-secret = true
minLength = 1
