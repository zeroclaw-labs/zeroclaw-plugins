name = "nonce-status"
version = "0.1.0"
description = "Inspect a durable nonce account: current nonce, authority, rent status, and whether spl-transfer-build can use it. Read-only, one RPC call. Holds no keys, moves nothing."
author = "zkasuran"
wasm_path = "nonce_status.wasm"
capabilities = ["tool"]
# http_client: one JSON-RPC call to the operator-configured Solana RPC
# endpoint (TLS host-side). config_read: rpc_url and the default
# nonce_account are read from this plugin's own config section.
permissions = ["http_client", "config_read"]
