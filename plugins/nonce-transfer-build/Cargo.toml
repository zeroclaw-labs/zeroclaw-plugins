[package]
name = "nonce-transfer-build"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw WIT tool plugin: build unsigned, durable-nonce-anchored SPL token transfers that survive human approval delays. T1 custody — the plugin never sees a private key; an operator-configured allowlist + caps are enforced before any bytes are built."
publish = false

# cdylib for the wasm component; rlib so the pure builder core is testable on
# the host with a plain `cargo test`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
solana-wasi-core = { path = "vendor/solana-wasi-core" }
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Standalone crate: built for wasm32-wasip2, not part of the host workspace.
[workspace]
