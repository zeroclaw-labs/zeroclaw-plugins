name = "nostr"
version = "0.2.0"
description = "Nostr channel plugin for ZeroClaw: subscribe to a relay over a host-mediated WebSocket and receive plaintext notes (kind 1) as inbound messages."
author = "JordanTheJet"
wasm_path = "nostr.wasm"
capabilities = ["channel"]
registry = false
permissions = ["websocket_client", "config_read", "state_read", "state_write"]
provides = "nostr"

[config_schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
additionalProperties = false

[config_schema.properties.relays]
type = "array"
items = { type = "string" }

[config_schema.properties.pubkey]
type = "string"
pattern = '^\s*(0x)?[a-fA-F0-9]{64}\s*$'

[config_schema.properties.kinds]
type = "array"
items = { type = "integer" }

[config_schema.properties.subscription_id]
type = "string"

[config_schema.properties.limit]
type = "integer"

[config_schema.properties.allowed_pubkeys]
type = "array"
items = { type = "string" }

[config_schema.properties.tls_profile]
type = "string"

[config_schema.properties.tls_ca]
type = "string"
x-secret = true

[config_schema.properties.relay]
type = "string"

[config_schema.properties.relay_url]
type = "string"

[config_schema.properties.public_key]
type = "string"
pattern = '^\s*(0x)?[a-fA-F0-9]{64}\s*$'

[config_schema.properties.private_key]
type = "string"
x-secret = true

[config_schema.properties.secret_key]
type = "string"
x-secret = true
