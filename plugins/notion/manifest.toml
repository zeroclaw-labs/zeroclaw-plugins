name = "notion"
version = "0.3.0"
description = "Notion task-queue channel plugin for ZeroClaw: poll a database for pending tasks and write results back over wasi:http."
author = "JordanTheJet"
wasm_path = "notion.wasm"
capabilities = ["channel"]
# http_client: outbound calls to api.notion.com (TLS is performed host-side).
# config_read: read the integration token + database id + property names from
# this channel's config section.
permissions = ["http_client", "config_read"]
# Notion has no canonical built-in channel config family. It is a novel channel
# configured from the `[[plugins.entries]]` record named `notion`.

# ── typed plugin config ───────────────────────────────────────────────────────
# `config_read` and `config_schema` are a biconditional: a host carrying the
# typed-config enforcement refuses to discover a manifest that requests one
# without the other (crates/zeroclaw-plugins/src/config.rs,
# compile_manifest_config). See zeroclaw-labs/zeroclaw-plugins#147.
#
# Keys are exactly the set this package's guest config struct
# deserializes from the JSON the host hands to `configure`, so
# `additionalProperties = false` cannot reject a key the plugin reads.
#
# `required` is the minimum set the guest's own activation predicate needs
# before it will make a call; a withheld `config_read` grant then fails closed
# instead of starting the channel half-configured.
#
# No `x-secret` here on purpose: the channel ABI vendored in this repo is
# `configure(config: string)` and the host serializes the whole operator map
# into that string, so the guest still receives credentials inline. Marking
# them `x-secret` only becomes correct alongside a guest that reads them
# through `secrets.get()` on the point-of-use ABI — a separate change.
[config_schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
required = ["api_key", "database_id"]
additionalProperties = false

[config_schema.properties.api_key]
type = "string"
minLength = 1
[config_schema.properties.database_id]
type = "string"
minLength = 1
[config_schema.properties.poll_interval_secs]
type = "integer"
[config_schema.properties.status_property]
type = "string"
[config_schema.properties.input_property]
type = "string"
[config_schema.properties.result_property]
type = "string"
[config_schema.properties.max_concurrent]
type = "integer"
[config_schema.properties.recover_stale]
type = "boolean"
[config_schema.properties.api_base_url]
type = "string"
