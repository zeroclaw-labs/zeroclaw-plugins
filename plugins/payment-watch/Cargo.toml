[package]
name = "payment-watch"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw WIT plugin: watch a Solana address for expected payments by reference key. T0, SOP-triggered, read-only."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-core = { path = "../solana-core" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

