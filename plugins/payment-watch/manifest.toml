name = "payment-watch"
version = "0.1.0"
description = "Check whether an expected Solana payment arrived, by its Solana Pay reference key. Read-only: two bounded RPC calls, reports payer, amount, mint and confirmation in one line. Holds no keys, moves nothing."
author = "zkasuran"
wasm_path = "payment_watch.wasm"
capabilities = ["tool"]
# http_client: JSON-RPC calls to the operator-configured Solana RPC endpoint
# (TLS host-side). config_read: rpc_url is read from this plugin's own config
# section; the tool never accepts an RPC URL as a call argument.
permissions = ["http_client", "config_read"]
