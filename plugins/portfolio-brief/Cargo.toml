[package]
name = "portfolio-brief"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Read-only Solana portfolio brief with compact balances, prices, and 24h changes."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bs58 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.46"

[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
