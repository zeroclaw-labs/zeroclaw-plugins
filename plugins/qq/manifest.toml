name = "qq"
version = "0.2.0"
description = "QQ Official Bot channel plugin for ZeroClaw: OAuth, gateway WebSocket, and text send."
author = "JordanTheJet"
wasm_path = "qq.wasm"
capabilities = ["channel"]
sender_match = "exact"
registry = false
permissions = ["http_client", "websocket_client", "config_read"]
provides = "qq"

[egress]
hosts = ["api.sgroup.qq.com", "bots.qq.com"]

[config_schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
additionalProperties = false
required = ["app_id", "app_secret"]

[config_schema.properties.app_id]
type = "string"
minLength = 1

[config_schema.properties.app_secret]
type = "string"
minLength = 1
x-secret = true

[config_schema.properties.enabled]
type = "boolean"
