[package]
name = "rent-reclaim-build"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw WIT tool plugin: build an unsigned transaction closing empty Solana token accounts, rent back to the owner (T1, no keys)."
authors = ["Udit Jain"]
publish = false

# cdylib for the wasm component; rlib so the pure build core is testable on the
# host with a plain `cargo test`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"

# wasi:http client — only compiled for the wasm component, never on the host.
[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Standalone crate: built for wasm32-wasip2, not part of the host workspace.
[workspace]
