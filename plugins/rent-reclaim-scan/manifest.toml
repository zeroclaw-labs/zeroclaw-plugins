name = "rent-reclaim-scan"
version = "0.1.0"
description = "Scan a Solana wallet for empty token accounts and the reclaimable rent locked in them (read-only)"
author = "Udit Jain"
wasm_path = "rent_reclaim_scan.wasm"
capabilities = ["tool"]
# http_client: outbound JSON-RPC to the configured Solana RPC endpoint (TLS is
# performed host-side). config_read: read `rpc_url` from this plugin's own
# config section; without it the public mainnet endpoint is used.
permissions = ["http_client", "config_read"]
