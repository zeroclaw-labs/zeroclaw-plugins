name = "signature-status"
version = "0.1.0"
description = "Inspect confirmation, slot, and error state for a public Solana transaction signature."
author = "Mateo Rojas"
wasm_path = "signature_status.wasm"
capabilities = ["tool"]
# http_client: one read-only getSignatureStatuses request.
# config_read: reads only rpc_url and commitment.
permissions = ["http_client", "config_read"]
