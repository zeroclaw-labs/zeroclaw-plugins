name = "slack"
version = "0.2.0"
description = "Slack channel plugin for ZeroClaw: Events API webhook ingest (HMAC-verified) + chat.postMessage over wasi:http."
author = "JordanTheJet"
wasm_path = "slack.wasm"
capabilities = ["channel"]
registry = false
permissions = ["http_client", "config_read"]
provides = "slack"

[egress]
hosts = ["slack.com"]

[config_schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
additionalProperties = false

[config_schema.properties.api_base_url]
type = "string"

[config_schema.properties.bot_token]
type = "string"
x-secret = true
minLength = 1

[config_schema.properties.signing_secret]
type = "string"
x-secret = true
minLength = 1
