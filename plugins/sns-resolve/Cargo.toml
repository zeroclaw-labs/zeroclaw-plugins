[package]
name = "sns-resolve"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw tool plugin: resolve .sol and raw Solana addresses. T0 custody tier — no keys, read-only."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "=0.46.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"

[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
