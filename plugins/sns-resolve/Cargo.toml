[package]
name = "sns-resolve"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw WIT tool: read-only Solana Name Service .sol resolution."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bs58 = "0.5"
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
