[package]
name = "solana-build-tx"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw WIT plugin: build Solana transactions from an Anchor IDL with simulation-based policy enforcement. T1 custody tier."
publish = false

# cdylib for the wasm component; rlib so the pure build core is testable
# on the host with a plain `cargo test`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
bs58 = "0.5"

[dev-dependencies]
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Standalone crate: built for wasm32-wasip2, not part of the host workspace.
[workspace]
