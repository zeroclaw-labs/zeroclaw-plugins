[package]
name = "solana-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Thin Solana JSON-RPC client for wasm32-wasip2 components: bs58, borsh, tx construction, blockhash/durable-nonce handling. Pure core, no solana-sdk dependency."
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
borsh = "1"
thiserror = "1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq = "2"

[target.'cfg(target_family = "wasm")'.dependencies]
waki = "0.2"