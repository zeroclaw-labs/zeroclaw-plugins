[package]
name = "solana-pay-request"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
description = "ZeroClaw tool plugin for deterministic, zero-network Solana Pay requests"
repository = "https://github.com/zeroclaw-labs/zeroclaw-plugins"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nanosol = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = "0.46"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
