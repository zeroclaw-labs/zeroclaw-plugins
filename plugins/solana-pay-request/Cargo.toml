[package]
name = "solana-pay-request"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw tool plugin that creates validated, non-custodial Solana Pay transfer requests."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
