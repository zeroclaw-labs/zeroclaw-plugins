[package]
name = "solana-pay-request"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw WIT plugin: build Solana Pay transfer request URLs for payment terminals. T1 (no secrets, returns unsigned URL)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-core = { path = "../solana-core" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

