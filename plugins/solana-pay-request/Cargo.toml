[package]
name = "solana-pay-request"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "ZeroClaw tool plugin that creates strict Solana Pay transfer request URIs."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bs58 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wit-bindgen = "0.46"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
