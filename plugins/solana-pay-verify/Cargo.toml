[package]
name = "solana-pay-verify"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw read-only tool plugin that verifies Solana Pay invoice settlement over JSON-RPC."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"

[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
