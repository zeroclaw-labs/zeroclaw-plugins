[package]
name = "solana-plugin-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A shared core crate for Solana WIT plugins: transaction serialization, signing, PDA derivation, and JSON-RPC API helpers."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
sha2 = "0.10"
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["alloc"] }
