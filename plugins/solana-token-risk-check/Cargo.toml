[package]
name = "solana-token-risk-check"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Read-only Solana mint authority, extension, and ownership-concentration risk checks"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
wstd = { version = "0.6.7", default-features = false }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
