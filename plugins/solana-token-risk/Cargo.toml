[package]
name = "solana-token-risk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw WIT plugin: check if a Solana token is safe. Returns RED/AMBER/GREEN with reasons."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
waki = "0.4"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
