name = "solana-token-risk"
version = "0.1.0"
description = "Live Solana token rug/honeypot risk evidence for a ZeroClaw agent: reads a mint over wasi:http and reports mint & freeze authority, Token-2022 dangerous extensions (transfer hook, permanent delegate, transfer fee, non-transferable, default-frozen), and holder concentration. Deterministic, read-only, no keys."
author = "furkanefecancaglar"
wasm_path = "solana_token_risk.wasm"
capabilities = ["tool"]
# http_client: outbound JSON-RPC reads to a Solana RPC endpoint (TLS host-side).
#   getAccountInfo (jsonParsed) + getTokenLargestAccounts + getTokenSupply — reads only.
# config_read: read the RPC url from this plugin's config section (falls back to a
#   public mainnet endpoint, and the caller may pass `rpc_url` per call).
permissions = ["http_client", "config_read"]
