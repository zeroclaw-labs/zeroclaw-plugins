[package]
name = "solana-tx-authorize"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Safe Hands T0 authorization component: decode, simulate, intent-match and policy-check a Solana transaction before anyone signs it. Holds no keys."
publish = false

# cdylib for the wasm component; rlib so the pure authorization core is testable
# on the host with a plain `cargo test`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
safe-hands-core = { path = "../../libs/safe-hands-core" }
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# wasi:http client — only compiled for the wasm component, never on the host.
[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Standalone crate: built for wasm32-wasip2, not part of the host workspace.
[workspace]
