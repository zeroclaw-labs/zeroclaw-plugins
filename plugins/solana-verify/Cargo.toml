[package]
name = "solana-verify"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "ZeroClaw WIT plugin: offline Solana verification — keccak Merkle proofs, ed25519 signatures, base58 pubkeys. Pure compute, no network."
publish = false

# cdylib for the wasm component; rlib so the pure verify core is testable on the
# host with a plain `cargo test`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# pure-compute crypto — all confirmed to compile to wasm32-wasip2
tiny-keccak = { version = "2", features = ["keccak"] }
sha2 = "0.10"
ed25519-dalek = "2"
bs58 = "0.5"
hex = "0.4"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Standalone crate: built for wasm32-wasip2, not part of a host workspace.
[workspace]

[dev-dependencies]
ed25519-dalek = "2"
