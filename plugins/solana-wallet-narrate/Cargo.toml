[package]
name = "solana-wallet-narrate"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw WIT plugin: narrate recent Solana wallet transactions in plain English."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
waki = "0.4"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
