[package]
name = "solsafe-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Pure SolSafe transaction audit and guarded Jupiter swap logic for ZeroClaw plugins."
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
base64 = "0.22"
bs58 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
