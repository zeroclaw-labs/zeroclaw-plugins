[package]
name = "spl-transfer-build"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw WIT plugin: build unsigned SPL token transfer transactions (T1, zero secrets)."
publish = false

# cdylib for the wasm component; rlib so the pure core is host-testable.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
base64 = "0.22"
sha2 = "0.10"
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "zeroize"] }

# wasi:http client — wasm component only
[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
