# Standalone crate (own [workspace]): built for wasm32-wasip2 as a tool plugin
# component; the pure `transfer` core (rlib) is host-tested against a mock RPC
# with plain `cargo test`. `waki` (the blocking wasi:http client) is a
# wasm-only dep so the host test build never tries to compile it.
[package]
name = "spl-transfer-build"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw WIT tool plugin: build unsigned SPL/SOL transfer transactions (versioned, base64) with ATA handling, memo, durable-nonce support, and in-plugin mint allowlist + spend caps. T1: signs nothing."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroclaw-solana-core = { path = "vendor/zeroclaw-solana-core" }

# wasi:http client — only compiled for the wasm component, never on the host.
[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1", features = ["json"] }

# SDK crates as host-only test oracles: prove the emitted base64 is a
# standard VersionedTransaction any wallet can deserialize.
[dev-dependencies]
solana-transaction = { version = "2", features = ["bincode"] }
solana-message = "2"
solana-signature = "2"
bincode = "1.3"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Standalone crate: built for wasm32-wasip2, not part of the host workspace.
[workspace]
