[package]
name = "spl-transfer-build"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
description = "ZeroClaw tool plugin for verified unsigned Solana SPL transfer transactions"
repository = "https://github.com/zeroclaw-labs/zeroclaw-plugins"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
nanosol = { git = "https://github.com/Fianko-codes/zeroclaw-solana.git", rev = "2093879cd1cc28c6182386706d70b8a56b3b07be" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(target_family = "wasm")'.dependencies]
waki = "0.5.1"
wit-bindgen = "0.46"

[dev-dependencies]
sha2 = "0.10"
spl-token-2022-interface = "=3.1.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
