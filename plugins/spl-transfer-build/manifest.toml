name = "spl-transfer-build"
version = "0.1.0"
description = "Build an unsigned Solana transfer transaction (SOL or SPL) under operator policy: recipient allowlist, per-transfer caps, optional durable nonce so the transaction survives an approval queue. Returns base64 bytes plus a plain digest; holds no keys, cannot sign or broadcast."
author = "zkasuran"
wasm_path = "spl_transfer_build.wasm"
capabilities = ["tool"]
# http_client: JSON-RPC calls to the operator-configured Solana RPC endpoint
# (TLS is performed host-side). config_read: the host injects this plugin's
# own config section (rpc_url, allow_recipients, caps, nonce_account) into
# execute args as `__config`; without it every transfer is refused (fail
# closed, empty policy denies all).
permissions = ["http_client", "config_read"]

# config_read and config_schema are a biconditional: issue #147 makes the host
# reject a manifest carrying either without the other, and it validates the
# operator's values against the schema below before the guest ever runs. Values
# arrive as typed JSON. The closed object plus an explicit properties map is what
# makes the config_read grant enumerable.
[config_schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
additionalProperties = false
required = ["rpc_url", "allow_recipients", "caps"]

[config_schema.properties.rpc_url]
type = "string"
description = "HTTPS Solana JSON-RPC endpoint every read goes through. Operator-set, never a call argument."
minLength = 1

# Comma-separated, because the guest parses both with split(','). Declaring
# them as arrays without converting the guest in the same commit would fail the
# whole parse rather than degrade.
[config_schema.properties.allow_recipients]
type = "string"
description = "Comma-separated base58 recipient addresses. Empty denies every transfer."
minLength = 1

[config_schema.properties.caps]
type = "string"
description = "Comma-separated per-transfer caps as mint:amount:decimals, SOL for native. Empty denies every transfer."
minLength = 1

# Optional: absent or empty means fresh-blockhash mode, so the empty string is
# a meaningful value and takes no minLength.
[config_schema.properties.nonce_account]
type = "string"
description = "Base58 durable nonce account. Empty or absent builds against a fresh blockhash."
