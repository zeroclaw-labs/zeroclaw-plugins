name = "spl-transfer-build"
version = "0.1.0"
description = "Build an unsigned SPL token transfer (versioned/legacy wire format, base64) with optional ATA create + memo (T1)."
author = "ZeroClaw Solana Track"
wasm_path = "spl_transfer_build.wasm"
capabilities = ["tool"]
# http_client: getLatestBlockhash / getAccountInfo via wasi:http
# config_read: rpc_url, max_amount, allowed_mints — no private keys ever
permissions = ["http_client", "config_read"]
