[package]
name = "sports-settlement-receipt"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw T0 tool plugin binding TxLINE sports proofs to finalized Solana receipts with RPC quorum"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
bs58 = "0.5"
curve25519-dalek = { version = "4", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
wit-bindgen = "0.46"

[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
