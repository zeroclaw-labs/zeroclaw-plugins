name = "telegram"
version = "0.4.0"
description = "Telegram channel plugin for ZeroClaw: getUpdates long-poll + sendMessage over wasi:http."
author = "JordanTheJet"
wasm_path = "telegram.wasm"
capabilities = ["channel"]
# Needs ZeroClaw v0.8.6 or later: it binds the plugin contract first released
# in v0.8.6 (typed config through config.get, credentials through
# secrets.get), and reads both when the host configures the instance.
registry = true
sender_match = "handle"
# http_client: getUpdates long-poll and sendMessage against the Bot API (TLS
#   is performed host-side).
# config_read: the typed config below through config.get; bot_token is
#   x-secret and reaches the plugin only through secrets.get.
permissions = ["http_client", "config_read"]
# provides: the built-in channel this package can stand in for. Hosts construct
# this plugin only from an explicit [channels.plugin.<alias>] binding, so it
# never reads [channels.telegram.*].
provides = "telegram"

# The hosts this plugin contacts. A declaration grants nothing: an operator
# grants them with `zeroclaw plugin bind telegram --channel-alias <alias>
# --egress declared`. api.telegram.org serves the Bot API.
[egress]
hosts = ["api.telegram.org"]

[config_schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
required = ["bot_token"]
additionalProperties = false

[config_schema.properties.bot_token]
type = "string"
x-secret = true
minLength = 1
[config_schema.properties.api_base_url]
type = "string"
[config_schema.properties.allowed_users]
type = "array"
[config_schema.properties.allowed_users.items]
type = "string"
[config_schema.properties.parse_mode]
type = "string"
