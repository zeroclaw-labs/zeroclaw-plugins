# Standalone crate (own [workspace]): built for wasm32-wasip2 as a tool plugin
# component; the pure `risk` core (rlib) is host-tested against a mock RPC with
# plain `cargo test`. `waki` (the blocking wasi:http client) is a wasm-only dep
# so the host test build never tries to compile it.
[package]
name = "token-risk-check"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw WIT tool plugin: red/amber/green risk report for any Solana mint — authorities, Token-2022 extensions (transfer hooks, fees, permanent delegates), and holder concentration, shaped to ~200 tokens. T0: read-only, zero custody."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroclaw-solana-core = { path = "vendor/zeroclaw-solana-core" }

# wasi:http client — only compiled for the wasm component, never on the host.
[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Standalone crate: built for wasm32-wasip2, not part of the host workspace.
[workspace]
