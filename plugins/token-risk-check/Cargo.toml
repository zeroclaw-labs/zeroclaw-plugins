[package]
name = "token-risk-check"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw WIT plugin: assess the on-chain risk of a Solana token mint before trading or displaying it."
publish = false

# cdylib for the wasm component; rlib so the pure assessment core is testable
# on the host with a plain `cargo test`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Metaplex metadata-PDA derivation (sha256 + base58 + ed25519 off-curve check)
# and base64 account-data decoding. Pure math — compiles on host and wasm.
sha2 = "0.10"
bs58 = "0.5"
curve25519-dalek = "4"
base64 = "0.22"

# wasi:http client — only compiled for the wasm component, never on the host.
[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Standalone crate: built for wasm32-wasip2, not part of the host workspace.
[workspace]
