[package]
name = "token-risk-check"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw WIT plugin (T0): Solana mint risk triage — red/amber/green with i18n."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bs58 = "0.5"

# wasi:http client — wasm component only (matches upstream plugin pattern).
[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1", features = ["json"] }

# Host-only live RPC helper (ignored tests / local smoke). Never linked into wasm.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
# Host-only: Windows needs native-tls (rustls Alone → UnknownIssuer / no backend).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
