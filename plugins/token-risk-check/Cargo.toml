[package]
name = "token-risk-check"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw WIT tool plugin: red/amber/green risk verdict for any Solana SPL / Token-2022 mint. Read-only (custody tier T0)."
publish = false

# cdylib for the wasm component; rlib so the pure analysis core is testable
# on the host with a plain `cargo test`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
base64 = "0.22"

# Component-only deps: the pure core must never depend on wasm.
[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = "0.46"
waki = { version = "0.5.1", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Standalone crate: built for wasm32-wasip2, not part of the host workspace.
[workspace]
