# Standalone crate (own [workspace]): built for wasm32-wasip2 as a tool plugin
# component. The pure `risk` core (rlib) is host-tested with plain `cargo test`
# against solana-core's MockTransport — no wasm toolchain, no network. `waki`
# is pulled in transitively by solana-core ONLY under cfg(target_family="wasm"),
# so the host test build never compiles it.
[package]
name = "token-risk-check"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "ZeroClaw tool plugin (T0): red/amber/green safety report for any SPL / Token-2022 mint — authorities, holder concentration, transfer hooks, fees, permanent delegate."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-core = { path = "../../crates/solana-core", features = ["http"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Standalone crate: built for wasm32-wasip2, not part of the host workspace.
[workspace]
