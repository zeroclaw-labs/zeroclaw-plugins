# Standalone crate (own [workspace]): built for wasm32-wasip2 as a tool-plugin
# component. The pure `risk` core (rlib) plus the shared `solana-core` substrate
# are host-tested with a plain `cargo test`; `waki` (the blocking wasi:http
# client) is a wasm-only dep so the host test build never compiles it.
[package]
name = "token-risk-check"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw tool plugin: red/amber/green safety verdict for a Solana token (authorities, Token-2022 extensions, holder concentration). Read-only (T0)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The shared, wasm-friendly Solana substrate (Track E). Pure Rust, no solana-sdk.
solana-core = { path = "../../crates/solana-core" }

# wasi:http client — only compiled for the wasm component, never on the host.
[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Standalone crate: built for wasm32-wasip2, not part of the host workspace.
[workspace]
