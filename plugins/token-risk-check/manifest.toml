name = "token-risk-check"
version = "0.1.0"
description = "Red/amber/green risk read on a Solana mint: mint/freeze authority, Token-2022 extension traps (transfer fee, transfer hook, permanent delegate, default-frozen, non-transferable), and holder concentration. Read-only (T0): no keys, no signing, no state."
author = "Rune Lynx"
wasm_path = "token_risk_check.wasm"
capabilities = ["tool"]
# http_client: JSON-RPC calls to the operator-configured Solana RPC (TLS is
#   performed host-side by wasi:http).
# config_read: the host injects this plugin's own config section (rpc_url,
#   optional top_holder_count) into execute args as `__config`. Without it the
#   plugin falls back to the public mainnet RPC endpoint.
permissions = ["http_client", "config_read"]
