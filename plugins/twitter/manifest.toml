name = "twitter"
version = "0.4.0"
description = "X/Twitter channel plugin for ZeroClaw: mentions polling + reply tweets over wasi:http."
author = "JordanTheJet"
wasm_path = "twitter.wasm"
capabilities = ["channel"]
# Needs ZeroClaw v0.8.6 or later: it binds the plugin contract first released
# in v0.8.6 (typed config through config.get, credentials through
# secrets.get), and reads both when the host configures the instance.
registry = true
# http_client: mentions polling and reply posts against the X API v2 (TLS is
#   performed host-side).
# config_read: the typed config below through config.get; bearer_token is
#   x-secret and reaches the plugin only through secrets.get.
permissions = ["http_client", "config_read"]
# provides: the built-in channel this package can stand in for. Hosts construct
# this plugin only from an explicit [channels.plugin.<alias>] binding, so it
# never reads [channels.twitter.*].
provides = "twitter"

# The hosts this plugin contacts. A declaration grants nothing: an operator
# grants them with `zeroclaw plugin bind twitter --channel-alias <alias>
# --egress declared`. api.x.com serves the X API v2.
[egress]
hosts = ["api.x.com"]

[config_schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
required = ["bearer_token"]
additionalProperties = false

[config_schema.properties.bearer_token]
type = "string"
x-secret = true
minLength = 1
[config_schema.properties.enabled]
type = "boolean"
[config_schema.properties.api_base_url]
type = "string"
[config_schema.properties.allowed_users]
type = "array"
[config_schema.properties.allowed_users.items]
type = "string"
[config_schema.properties.excluded_tools]
type = "array"
[config_schema.properties.excluded_tools.items]
type = "string"
