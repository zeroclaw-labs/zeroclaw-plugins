[package]
name = "wallet-narrate"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = "0.46"
