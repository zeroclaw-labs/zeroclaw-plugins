name = "wati"
version = "0.2.0"
description = "WATI (WhatsApp Business API) channel plugin for ZeroClaw: webhook ingress (host-routed) + text send over wasi:http."
author = "JordanTheJet"
wasm_path = "wati.wasm"
capabilities = ["channel"]
registry = false
permissions = ["http_client", "config_read"]
provides = "wati"

[egress]
hosts = ["live-mt-server.wati.io"]

[config_schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
additionalProperties = false

[config_schema.properties.enabled]
type = "boolean"

[config_schema.properties.api_url]
type = "string"

[config_schema.properties.tenant_id]
type = "string"

[config_schema.properties.api_token]
type = "string"
x-secret = true
minLength = 1
