name = "wechat"
version = "0.4.0"
description = "WeChat (iLink Bot) channel plugin for ZeroClaw: getUpdates long-poll + sendMessage over wasi:http."
author = "JordanTheJet"
wasm_path = "wechat.wasm"
capabilities = ["channel"]
# Needs ZeroClaw v0.8.6 or later: it binds the plugin contract first released
# in v0.8.6 (typed config through config.get, credentials through
# secrets.get), and reads both when the host configures the instance.
registry = true
# http_client: getupdates long-poll and sendmessage against the iLink Bot API
#   (TLS is performed host-side).
# config_read: the typed config below through config.get; bot_token is
#   x-secret and reaches the plugin only through secrets.get.
permissions = ["http_client", "config_read"]
# provides: the built-in channel this package can stand in for. Hosts construct
# this plugin only from an explicit [channels.plugin.<alias>] binding, so it
# never reads [channels.wechat.*].
provides = "wechat"

# The hosts this plugin contacts. A declaration grants nothing: an operator
# grants them with `zeroclaw plugin bind wechat --channel-alias <alias>
# --egress declared`. ilinkai.weixin.qq.com serves the iLink Bot API; the
# plugin transfers no media, so it never contacts the iLink CDN.
[egress]
hosts = ["ilinkai.weixin.qq.com"]

[config_schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
required = ["bot_token"]
additionalProperties = false

[config_schema.properties.enabled]
type = "boolean"
[config_schema.properties.api_base_url]
type = "string"
[config_schema.properties.cdn_base_url]
type = "string"
[config_schema.properties.state_dir]
type = "string"
[config_schema.properties.excluded_tools]
type = "array"
[config_schema.properties.excluded_tools.items]
type = "string"
[config_schema.properties.bot_token]
type = "string"
x-secret = true
minLength = 1
