name = "wecom-ws"
version = "0.2.0"
description = "WeCom AI Bot WebSocket channel plugin for ZeroClaw with host-mediated text callbacks and replies."
author = "JordanTheJet"
wasm_path = "wecom_ws.wasm"
capabilities = ["channel"]
sender_match = "exact"
registry = false
permissions = ["websocket_client", "config_read"]
provides = "wecom_ws"

[egress]
hosts = ["openws.work.weixin.qq.com"]

[config_schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
additionalProperties = false
required = ["bot_id", "secret"]

[config_schema.properties.bot_id]
type = "string"
minLength = 1

[config_schema.properties.secret]
type = "string"
minLength = 1
x-secret = true

[config_schema.properties.bot_name]
type = "string"

[config_schema.properties.enabled]
type = "boolean"

[config_schema.properties.allowed_users]
type = "array"
items = { type = "string" }

[config_schema.properties.allowed_groups]
type = "array"
items = { type = "string" }

[config_schema.properties.stream_mode]
type = "string"
enum = ["off", "partial"]
