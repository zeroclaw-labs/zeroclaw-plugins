name = "wecom"
version = "0.2.0"
description = "Send-only WeCom Bot Webhook channel plugin for ZeroClaw over wasi:http."
author = "JordanTheJet"
wasm_path = "wecom.wasm"
capabilities = ["channel"]
sender_match = "exact"
# http_client: post text messages to the configured WeCom Bot Webhook.
# config_read: read [channels.wecom.*] when loaded as a mirror plugin.
permissions = ["http_client", "config_read"]
# provides: mirror the built-in `wecom` channel — read the existing
# channel config as the single source of truth and honor native-wins.
provides = "wecom"

# ── typed plugin config ───────────────────────────────────────────────────────
# `config_read` and `config_schema` are a biconditional: a host carrying the
# typed-config enforcement refuses to discover a manifest that requests one
# without the other (crates/zeroclaw-plugins/src/config.rs,
# compile_manifest_config). See zeroclaw-labs/zeroclaw-plugins#147.
#
# Keys are exactly the set this package's guest config struct
# deserializes from the JSON the host hands to `configure`, so
# `additionalProperties = false` cannot reject a key the plugin reads.
#
# `required` is the minimum set the guest's own activation predicate needs
# before it will make a call; a withheld `config_read` grant then fails closed
# instead of starting the channel half-configured.
#
# No `x-secret` here on purpose: the channel ABI vendored in this repo is
# `configure(config: string)` and the host serializes the whole operator map
# into that string, so the guest still receives credentials inline. Marking
# them `x-secret` only becomes correct alongside a guest that reads them
# through `secrets.get()` on the point-of-use ABI — a separate change.
[config_schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
required = ["webhook_key"]
additionalProperties = false

[config_schema.properties.enabled]
type = "boolean"
[config_schema.properties.webhook_key]
type = "string"
minLength = 1
