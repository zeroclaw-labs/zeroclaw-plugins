name = "whatsapp"
version = "0.2.0"
description = "WhatsApp Cloud (Meta Graph) channel plugin for ZeroClaw: webhook verification + signed inbound events + sendMessage over wasi:http."
author = "JordanTheJet"
wasm_path = "whatsapp.wasm"
capabilities = ["channel"]
registry = false
permissions = ["http_client", "config_read"]
provides = "whatsapp"

[egress]
hosts = ["graph.facebook.com"]

[config_schema]
"$schema" = "https://json-schema.org/draft/2020-12/schema"
type = "object"
additionalProperties = false

[config_schema.properties.enabled]
type = "boolean"

[config_schema.properties.phone_number_id]
type = "string"

[config_schema.properties.api_base_url]
type = "string"

[config_schema.properties.access_token]
type = "string"
x-secret = true
minLength = 1

[config_schema.properties.app_secret]
type = "string"
x-secret = true
minLength = 1

[config_schema.properties.verify_token]
type = "string"
x-secret = true
minLength = 1
