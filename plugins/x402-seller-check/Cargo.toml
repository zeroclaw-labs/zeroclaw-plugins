[package]
name = "x402-seller-check"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw WIT plugin (T0): heuristic x402 seller security GO/NO-GO with i18n."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
